backend:
  name: github
  repo: mango-stop/mango-stop.github.io
  branch: main
  base_url: https://sveltia-cms-auth.msj121702.workers.dev

media_folder: public/uploads
public_folder: /uploads

site_url: https://mango-stop.github.io

collections:
  - name: pages
    label: 페이지
    files:
      - name: home
        label: 홈 화면
        file: src/content/home/home.md
        fields:
          - { name: title, label: 메인 제목, widget: string }
          - { name: tagline, label: 소개 문구, widget: string }

      - name: portfolio
        label: 포트폴리오
        file: src/content/publications/publications.json
        fields:
          - name: items
            label: 논문/발표 목록
            widget: list
            label_singular: 항목
            summary: '{{fields.title}} — {{fields.venue}}'
            fields:
              - { name: id, label: '고유 ID (영문/숫자/하이픈, 저장 후 되도록 변경 금지)', widget: string, hint: '예: kciss-2026-object-detection' }
              - { name: title, label: 논문/발표 제목, widget: string }
              - name: type
                label: 구분
                widget: select
                options:
                  - { label: 저널, value: journal }
                  - { label: 컨퍼런스(학술대회), value: conference }
                default: conference
              - name: scope
                label: 국내/국외
                widget: select
                options:
                  - { label: 국내, value: domestic }
                  - { label: 국외, value: international }
                default: domestic
              - { name: venue, label: '학회명 / 저널명', widget: string, hint: '예: 한국정보과학회 학술대회, IEEE Access 등' }
              - name: status
                label: 게재상황
                widget: select
                options: [게재완료, 게재예정, 심사중, 발표완료, 투고예정]
                default: 발표완료
              - { name: date, label: '연도-월', widget: string, hint: '예: 2026-08 (정렬 및 표시에 사용)' }
              - { name: link, label: '관련 링크 (선택)', widget: string, required: false, hint: '논문/프로시딩/DOI 링크' }

      - name: about
        label: About (소개)
        file: src/content/about/about.md
        fields:
          - { name: name, label: 이름, widget: string, required: false, hint: '비워두면 표시되지 않습니다' }
          - { name: role, label: 직함/학년, widget: string }
          - { name: affiliation, label: 소속, widget: string }
          - { name: email, label: 이메일, widget: string }
          - { name: github, label: GitHub 아이디, widget: string }
          - { name: body, label: 소개글, widget: markdown }

  - name: posts
    label: 게시물
    folder: src/content/posts
    create: true
    slug: '{{fields.slug}}'
    preview_path: 'posts/{{slug}}/'
    extension: md
    format: frontmatter
    sortable_fields: [pubDate, title]
    view_filters:
      - label: 일기
        field: category
        pattern: diary
      - label: 논문 리뷰
        field: category
        pattern: paper-review
      - label: 프로젝트
        field: category
        pattern: project
    fields:
      - { name: title, label: 제목, widget: string }
      - { name: slug, label: '주소(URL) 이름', widget: string, hint: '글 주소 https://mango-stop.github.io/posts/여기/ 에 들어갈 부분입니다. 영어/숫자/하이픈(-)만 사용하세요. 예: my-first-post' }
      - { name: description, label: 요약, widget: string }
      - { name: pubDate, label: 작성일, widget: datetime, format: 'YYYY-MM-DD', time_format: false }
      - name: category
        label: 카테고리
        widget: select
        options:
          - { label: 일기, value: diary }
          - { label: 논문 리뷰, value: paper-review }
          - { label: 프로젝트, value: project }
        default: diary
      - { name: tags, label: 태그, widget: list, default: [], required: false }
      - { name: cover, label: 대표 이미지, widget: image, required: false, hint: '비워두면 본문의 첫 번째 이미지가 자동으로 사용됩니다' }
      - { name: draft, label: 임시글, widget: boolean, default: false, required: false }
      - name: body
        label: 본문
        widget: markdown
        editor_components: [image, code-block, table, internal-link]
